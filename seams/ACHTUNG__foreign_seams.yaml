  # ---- level 1: the context engine's ONE monkeypatch into core ------------
  #
  # Added 2026-09-08 with Plan13 (`context_ctl/`). Nine seams for ONE feature,
  # and they are listed apart because each fails ALONE, silently, in a
  # different way - which is the whole reason this file exists. Six are the
  # bridge and the engine's own wiring; three (the gateway session registry,
  # their row-replacement primitive, their token estimator) came with Task
  # 3/4, when applying a selection ON DEMAND turned out to need the gateway's
  # session dict rather than the agent — and then, after a live run, to need
  # replace_messages rather than their compaction pipeline.
  #
  # The mechanism (Recon26, live-confirmed): `AIAgent.__init__` is wrapped so
  # `self` sits in a threading.local while the original runs; nested inside
  # that same synchronous call, `_inject_context_engine_tools(agent)` invokes
  # our own official `on_session_start()`, which reads the thread-local and
  # keeps a weakref. Zero business logic in the patch. WHY it exists at all:
  # no official plugin door hands over the live agent, and without it there is
  # no cache-parity side question to the model (Recon24).
  #
  # The patch installs ONLY when Hermes' own `context.engine` names `ctxctl`;
  # not selected -> nothing in core is touched. So a green run of this section
  # proves the seams are present, not that the patch is installed anywhere.

  - id: ctxctl.init_is_a_thin_forwarder
    level: 1
    file: run_agent.py
    kind: symbol
    symbol: init_agent(self, **init_kwargs)
    baseline_count: 1
    we_do: >-
      Wrap AIAgent.__init__ and call the original unchanged. This literal is
      the whole body we rely on: a THIN forwarder means our wrapper needs no
      argument reshaping and cannot drift out of sync with a growing signature
      (60+ keyword parameters today).
    breaks: >-
      If __init__ stops being a forwarder (real logic moves in, or agents get
      built through a factory/__new__ path that skips it), our wrapper either
      misses those agents silently or has to know about their construction. A
      signature drift itself is LOUD by design - it breaks construction on the
      first session, which is exactly why this patch point was chosen over
      self_delegate's _execute_tool_calls (Recon25/Recon26).
    asserted_by: tests/test_context_ctl.py::test_bridge_hands_live_agent_to_on_session_start

  - id: ctxctl.on_session_start_called_in_init
    level: 1
    file: agent/agent_init.py
    kind: symbol
    symbol: def _inject_context_engine_tools
    baseline_count: 1
    we_do: >-
      Rely on this function being called from init_agent SYNCHRONOUSLY, on the
      same thread, and on it calling
      `agent.context_compressor.on_session_start(...)`. That nesting is the
      entire bridge: it is what lets our own official hook read the
      thread-local the wrapper has just set.
    breaks: >-
      Renamed, or the on_session_start call moves into a thread/executor/async
      task -> the patch installs as usual, `capture()` returns None, and the
      warm-cache channel silently stops existing. Nothing raises.
    asserted_by: tests/test_context_ctl.py::test_inject_context_engine_tools_calls_on_session_start_synchronously

  - id: ctxctl.engine_selected_by_config_key
    level: 1
    file: agent/agent_init.py
    kind: symbol
    symbol: get("engine", "compressor")
    baseline_count: 1
    we_do: >-
      Read the SAME key ourselves (`context.engine` in their config.yaml) to
      decide whether to install the patch at all - our footprint in core must
      appear only after the owner selected us through their own switch. The
      value is compared against `engine.name`, so our name string is part of
      this seam too.
    breaks: >-
      The key moves, or the comparison stops being against `engine.name` -> we
      either install the patch while their built-in compressor is the one
      actually running (footprint with no engine), or refuse to install while
      ours IS selected (engine with no bridge). Both silent.
    asserted_by: tests/test_context_ctl.py::test_real_selection_path_deepcopies_us_and_the_copy_still_catches_the_agent

  # 2026-09-25, test tree 27df3b8847: `_select_context_engine` no longer
  # calls `copy.deepcopy(_candidate)`. It calls `_candidate.clone_for_agent()`,
  # and `ContextEngine.clone_for_agent` defaults to `return copy.deepcopy(self)`
  # (agent/context_engine.py). Our `__deepcopy__` is what that hits. We do not
  # override `clone_for_agent`. Prod 1021a03256 still has the old line, so a
  # check of prod_root fails this seam until the live tree moves.
  - id: ctxctl.engine_is_deepcopied_per_agent
    level: 1
    file: agent/agent_init.py
    kind: symbol
    symbol: _candidate.clone_for_agent()
    baseline_count: 1
    we_do: >-
      Inherit `ContextEngine.clone_for_agent` unchanged and implement
      `__deepcopy__`. Every agent gets its own copy of the registered
      singleton, and the COPY is the live engine that must catch that agent.
      The copy itself is the default body `return copy.deepcopy(self)` in
      `agent/context_engine.py`, not a call in `agent_init.py`. Consequence
      we design around: nothing written to engine attributes is visible to
      the panel route or the slash command — anything needed OUTSIDE the
      session goes to a file (context_ctl/_state.py), the same rule the
      ledger follows.
    breaks: >-
      If `_select_context_engine` stops calling `clone_for_agent`, sessions
      share one engine instance and per-session state (agent ref, status)
      silently crosses over. If `clone_for_agent` stops deep-copying, or the
      copy raises, their code falls back to the built-in compressor with a
      warning and our engine is simply absent.
    asserted_by: tests/test_context_ctl.py::test_real_selection_path_deepcopies_us_and_the_copy_still_catches_the_agent

  - id: ctxctl.forced_compress_entry
    level: 1
    file: agent/compression_facade.py
    kind: symbol
    symbol: def _compress_context
    baseline_count: 1
    we_do: >-
      Call `agent._compress_context(messages, None, focus_topic=..., force=True)`
      to apply a compaction ON DEMAND (panel button) instead of waiting for
      their turn pipeline - the same entry their own /compress uses (Recon23).
      Live-confirmed to reach our `compress()` in one call without touching
      `prune_tool_results_only()`, which is why the manual mechanisms live in
      `compress()` (Plan13 Task 0).
    breaks: >-
      Renamed, or the kwargs change -> the panel's "apply now" button has no
      way to trigger anything, and automatic compaction (which we deliberately
      do not implement yet) would be the only path left.
    asserted_by: tests/test_context_ctl.py::test_forced_compress_from_the_host_reaches_our_compress

  - id: ctxctl.manual_compress_focus
    level: 1
    file: agent/conversation_compression_manual.py
    kind: symbol
    symbol: focus_topic=request.focus_topic, force=True
    baseline_count: 1
    we_do: >-
      Their manual `/compress <text>` / `/compact <text>` (one parser,
      `parse_compress_args`, for every surface) reaches our `compress()` through
      `compress_now` -> `agent._compress_context(head, ..., focus_topic=<text>,
      force=True)`; we read `focus_topic` as the user's compaction wish (Plan34).
      `here N` gives us only the head, the tail goes as `verbatim_tail` and is
      rejoined by them - we cut our pick to the head (`engine._in_tape`). With
      `here N` their parser DROPS any prose (focus_topic None) - by their design.
    breaks: >-
      The prose stops arriving as `focus_topic`, or `force` stops being True ->
      manual `/compress` runs our compaction without the wish, or not at all
      (identity); a changed `here N` split -> we may pick rows they re-append.
    asserted_by: tests/test_context_ctl.py::test_manual_compress_focus_reaches_compress

  - id: ctxctl.gateway_session_registry
    level: 1
    file: tui_gateway/server.py
    kind: symbol
    symbol: "_sessions: dict[str, dict] = {}"
    baseline_count: 1
    we_do: >-
      Walk it to find the session dict belonging to a captured agent (matched by
      object IDENTITY, since the registry key is a gateway session key that
      need not equal agent.session_id and their own
      _sync_session_key_after_compress rewrites it). We need the dict because
      the LIVE conversation history is NOT on the agent - it is
      session["history"] under session["history_lock"] with a
      session["history_version"] guard, and that is what their own compress
      route reads and writes.

      Since 2026-09-09 the DASHBOARD half reads the same registry, and that is
      why the panel's apply button needs no monkeypatch: the route is served in
      the SAME process as the gateway (web_server.py imports tui_gateway.server;
      desktop chat runs agents in-process via server._make_agent), so
      `_sessions[key]["agent"].context_compressor` IS our live engine, reached
      exactly the way their own dispatcher reaches a session. There we look up
      BY KEY first (what the dispatcher does), then by asking each live engine
      for its own session id - the two differ whenever
      _sync_session_key_after_compress has run.
    breaks: >-
      Renamed, moved, or turned into a class -> /ctx-drop cannot find the
      session and says so, offering their own `/compress ctxdrop` as the way
      around (which needs neither this seam nor the next). The panel's apply
      button answers with the same refusal, naming the live sessions. Degrades
      to a named workaround, never to a wrong write.
    asserted_by: tests/test_context_stubs.py::test_c3b_a_missing_session_registry_is_reported_not_raised

  - id: ctxctl.replace_messages
    level: 1
    file: hermes_state_messages.py
    kind: symbol
    symbol: def replace_messages
    baseline_count: 1
    we_do: >-
      Commit a surgical rewrite with
      `replace_messages(session_id, full_history, archive_dropped=True,
      reject_active_turn_lease=True)` - their own primitive for /undo, /retry
      and /compress. Replaced rows go to the rewind archive (active=0,
      compacted=0: hidden from the display read, still searchable and
      recoverable) and the new set stays the ONLY generation, so order is
      correct in both the model's view and the human's.
    breaks: >-
      Renamed or the kwargs change -> /ctx-drop refuses and says so; the
      context is left untouched. NOT a silent seam for once: nothing is
      written if this call fails.
      WHY THIS AND NOT archive_and_compact, which we used until 2026-09-08:
      measured on a real SQLite (__HQ/recon/subjects/ctxdrop-row-order/), the
      same edit through archive_and_compact gave the model a CORRECT prompt
      and the human a SCRAMBLED transcript - 14 rows (whole conversation
      twice) with no timestamps, 9 (the rewritten pair at the end) with them,
      vs 7 and 7 here. Cause is structural: their display dedupe
      (_dedupe_display_generations) keys on
      (role, content, timestamp, tool_call_id, tool_calls, tool_name) and
      orders by the FIRST row id of that key, so anything whose content we
      rewrite is a NEW logical message sorted to the end while its archived
      predecessor still renders in place. archive_and_compact is built to
      collapse a range into a summary, not to rewrite a field in place.
    asserted_by: tests/test_context_stubs.py::test_c9_commit_writes_the_db_before_the_gateway_memory

  - id: ctxctl.turn_lease_error_name
    level: 1
    file: hermes_state_errors.py
    kind: symbol
    symbol: class SessionTurnLeaseLostError
    baseline_count: 1
    we_do: >-
      Tell "a turn is running" from a real failure by the exception CLASS NAME
      raised by `replace_messages(..., reject_active_turn_lease=True)`
      (`_apply._TURN_BUSY_ERRORS`: this and SessionCompressionInProgressError).
      Manual compaction then WAITS for the turn to end and rebuilds over the
      fresh tape instead of throwing the paid interrogation away (2026-09-30).
    breaks: >-
      Renamed -> the refusal is no longer recognised as "busy": manual compaction
      refuses as it did before 2026-09-30 (context untouched, summary kept in the
      run report). Degrades to a refusal, never to a wrong write. The other
      retry signal (rows appended by the turn, `BUSY_MOVED`) is ours and stays.
    asserted_by: tests/test_context_compact.py::test_e4_write_waits_for_the_turn_and_takes_the_fresh_tail

  - id: ctxctl.agent_route_fields
    level: 1
    file: agent/turn_context.py
    kind: symbol
    symbol: '"requested_provider", "base_url", "api_key", "api_mode", "auth_mode", "session_id"'
    baseline_count: 1
    we_do: >-
      Our compaction talks to the session's model DIRECTLY (`_llm.route_of`):
      `agent.base_url`, `agent.model`, `agent.api_key`, `agent.api_mode` of the
      live agent - the same attributes their turn_context binds into the
      auxiliary route on every turn. Not ctx.llm: outside a turn their `auto`
      guessed a provider and sent a whole session to Gemini (2026-09-30).
    breaks: >-
      Attributes renamed -> `route_of` finds no base_url/model and refuses in
      words; compaction does not run and nothing is sent anywhere else. Their
      binding list changing here is the early warning to re-check the names.
    asserted_by: tests/test_context_llm.py::test_l1_no_route_no_model

  - id: ctxctl.get_messages_is_the_write_source
    level: 1
    file: hermes_state_messages.py
    kind: symbol
    symbol: "def get_messages(self, session_id: str, include_inactive"
    baseline_count: 1
    we_do: >-
      Read the list we are about to rewrite with `get_messages(session_id)` -
      defaults are exactly what we need: active rows only, ORDER BY id ASC
      ("never timestamp: clocks regress"), content/tool_calls decoded. The
      dicts it returns are fed straight back into replace_messages, and every
