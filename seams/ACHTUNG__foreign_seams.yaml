  - id: bridge.json_loads_literal
    level: 1
    file: tools/code_execution_tool.py
    kind: our_literal
    our_module: file_ops/_execute_code_bridge.py
    our_attr: _JSON_LOADS_OLD_TAIL
    min_count: 2
    baseline_count: 2
    we_do: >-
      Replace this exact source text so the sandbox stub's json.loads() falls
      back to the raw string instead of raising. The literal is read from OUR
      module, so this checks precisely what the runtime will search for.
    breaks: >-
      ANY reformatting of that fragment on their side - even whitespace - and
      the replacement finds nothing. The patch logs a warning and skips; the
      first sandbox call that gets non-JSON then raises JSONDecodeError.
