  # ---- level 1: the NAMES we take over -----------------------------------
  #
  # The foundation of the whole plugin, and the hole this registry had on the
  # day it was written: the first real run (afc3d9d34, 1770 commits) reported
  # "no broken seams" while upstream had renamed `process` to `process_manage`.
  # Our `def _handle_process` check stayed green because the FUNCTION was
  # untouched - only the registered NAME moved, and nothing was watching that.
  #
  # Why a rename is worse than a break: `override=True` is a no-op when no
  # name collides, so our tool registers as a NEW plugin tool. And per
  # `tools/tool_search.py::is_deferrable_tool_name`, a plugin tool that is
  # neither core nor a GUI toolset IS deferrable - so it goes behind the
  # tool_search bridge, invisible until searched. Silently, with no error.
  #
