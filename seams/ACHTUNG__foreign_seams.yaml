# level 5 = we would notice from a test failure anyway
seams:

  # ---- level 1: we depend on the TEXT of their code, not its interface ----

  - id: bridge.tool_stubs
    level: 1
    file: tools/code_execution_tool.py
    kind: symbol
    symbol: _TOOL_STUBS
    baseline_count: 2
    we_do: >-
      Overwrite one entry per wrapped tool, value built from our own
      registered schema. Shape changed at 6e2b8e070 (7123-commit jump from
      1cb3ab617): was a 4-tuple (name, sig, doc, args_expr) with the name
      redundantly repeated inside the tuple; core dropped it, value is now
      a 3-tuple (sig, doc, args_expr), name only the dict key. Our bridge
      (file_ops/_execute_code_bridge.py::patch_execute_code_bridge) no
      longer assumes either shape - it samples a core-owned entry
      ("web_search", which we never touch) and matches its arity.
    breaks: >-
      Renamed, or the tuple's shape/arity changes to something our sampling
      doesn't anticipate -> the stub is not replaced and the model reads
      core's stale signature for our tool. Second case of a green baseline
      count hiding a changed shape; first was override.name_process.
    asserted_by: tests/test_plugin_integration.py::test_e2b_execute_code_stubs_patched

  - id: bridge.tool_doc_lines
    level: 1
    file: tools/code_execution_tool.py
    kind: symbol
    symbol: _TOOL_DOC_LINES
    baseline_count: 2
    we_do: >-
      Rebuild the (name, doc) pair for each wrapped tool. This is the ONLY
      place the model is told what our sandbox facade returns.
    breaks: >-
      Renamed or restructured -> the model is told our tools return core's
      old per-tool dict keys, which no longer exist.
    asserted_by: tests/test_plugin_integration.py::test_e2b_execute_code_stubs_patched

  - id: bridge.uds_transport_header
    level: 1
    file: tools/code_execution_tool.py
    kind: symbol
    symbol: _UDS_TRANSPORT_HEADER
    baseline_count: 2
    we_do: Substring-replace the response-parsing tail inside this template.
    breaks: Renamed -> no patch, see bridge.json_loads_literal for the worse half.
    asserted_by: tests/test_plugin_integration.py::test_e2c_execute_code_bridge_seam_status

  - id: bridge.file_transport_header
    level: 1
    file: tools/code_execution_tool.py
    kind: symbol
    symbol: _FILE_TRANSPORT_HEADER
    baseline_count: 2
    we_do: Same substring replacement as the UDS template.
    breaks: >-
      Renamed -> the file-transport template of execute_code is not patched
