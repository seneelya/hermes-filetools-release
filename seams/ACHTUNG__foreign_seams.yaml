# ==========================================================================
#  A C H T U N G  —  every place this plugin depends on FOREIGN code
# ==========================================================================
# Machine-readable. Read by `check_seams.py`; the prose lives in
# ../HowTo__Verify_after_hermes_update.md (what to do when one breaks) and
# HowTo__Verify_before_hermes_update.md (how to check BEFORE updating).
#
# THE RULE THIS FILE EXISTS FOR: almost nothing here fails loudly. A dead
# monkeypatch logs a warning and skips; a renamed contextvar just drops a
# field; a rebuilt schema silently reaches the model instead of ours. So a
# seam is verified by asserting it is PRESENT, never by "nothing raised".
#
# `baseline_count` is OCCURRENCES (str.count), NOT lines. Do not re-measure
# it with `grep -c`, which counts matching LINES - two hits on one line make
# the two disagree, and the first version of this file was off by one on two
# entries for exactly that reason. Re-measure with the checker itself.
#
# A `baseline_count` is INFORMATION, not a verdict: they may add a use of a
# symbol without breaking anything. The verdict comes from `min_count` (the
# symbol still exists at all) plus, where the count cannot prove it,
# `asserted_by` — a test of ours that checks the SHAPE. An entry with
# `kind: test_only` has no static check by nature; the checker prints it as
# a reminder to run that test, and that is deliberate, not a gap.
#
# Adding a seam: any new dependency on a name, literal or behaviour that is
# not ours. If you cannot name what breaks, you do not understand the seam
# yet — write that down instead of a guess.

