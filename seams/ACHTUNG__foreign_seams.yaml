  - id: bridge.terminal_blocked_params
    level: 1
    file: tools/code_execution_rpc.py
    kind: symbol
    symbol: _TERMINAL_BLOCKED_PARAMS
    baseline_count: 2
    we_do: >-
      Read it to EXCLUDE those params from terminal's generated stub, since
      the RPC server pops them before dispatch anyway.
      WORKED EXACTLY AS INTENDED at afc3d9d34: the set grew from four entries
