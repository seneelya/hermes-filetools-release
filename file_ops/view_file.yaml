# Source: prototype SCHEMA_MOC__read_file_tool.py — description/parameters unchanged;
# only the name was renamed. The core registry overrides "name" with entry.name
# anyway (registry.get_definitions), so the value here is for clarity only.
name: read_file
description: >
  Read a text file with line numbers and pagination. Use this instead of
  terminal. Use offset and limit for large files.

  Non-text formats readable via conversion: .ipynb, .docx, .xlsx, PDF, and
  other document formats.
required: [path]
properties:
  path:
    type: string
    description: Path to the file to read (absolute, relative, or ~/path)
  offset:
    type: integer
    description: "Line number to start reading from (1-indexed, default: 1)"
    default: 1
    minimum: 1
  limit:
    type: integer
    description: >
      Maximum number of lines to read (default: 2000, max: 2000). Reads are
      additionally capped at a ~100K-character budget with a next_offset
      continuation.
    default: 2000
    maximum: 2000


#OLD
#  Read a text file with line numbers and pagination. Use this instead of
#  cat/head/tail in terminal. Output format: 'LINE_NUM|CONTENT'. Suggests
#  similar filenames if not found. Use offset and limit for large files.
#  Reads exceeding ~100K characters are truncated on a line boundary and
#  return a next_offset; continue with offset to read the rest. Jupyter
#  notebooks (.ipynb), Word documents (.docx), and Excel workbooks (.xlsx)
#  are auto-extracted to readable text; PDF, legacy Office (.doc/.ppt/.xls),
#  OpenDocument, RTF, and EPUB convert too when the optional anydoc converter
#  is available (auto-installed on first use where installs are permitted).
#  PDF conversion reads the text layer only: scanned/image pages yield no
#  text, and when many pages come back empty the output ends with an
#  EXTRACTION COVERAGE WARNING listing the affected pages — follow its
#  instructions (render pages with pdftoppm and inspect via vision_analyze,
#  or OCR) instead of treating the extraction as complete. NOTE: Cannot read
#  images or other binary files — use vision_analyze for images.
